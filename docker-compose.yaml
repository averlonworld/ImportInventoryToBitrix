services:

  # ==========================================
  # PostgreSQL (primary datastore)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: bitrix_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitrix_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bitrix_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # ==========================================
  # Redis (BullMQ queue backing store)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: bitrix-inventory-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    ports:
      # Published for a backend running on the host (npm start) during local dev.
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # ==========================================
  # Backend (Express + Prisma)
  # ==========================================
  bitrix-inventory-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitrix-inventory-backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./.env
    environment:
      # Force production regardless of the local .env value.
      NODE_ENV: production
      PORT: "5000"
      # Always address the sibling containers, never localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bitrix_inventory}
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod-network
      - lms-network

  # ==========================================
  # Frontend (React + Vite, served by Nginx)
  # ==========================================
  bitrix-inventory-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: bitrix-inventory-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - bitrix-inventory-backend
    networks:
      - prod-network
      - lms-network

networks:
  # Created automatically if missing; reused if they already exist on the host.
  prod-network:
    name: prod-network
  lms-network:
    name: lms-network

volumes:
  postgres_data:
  redis_data:

