services:
  postgres:
    image: postgres:15-alpine
    container_name: bitrix_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  redis:
    image: redis:7-alpine
    container_name: bitrix_inventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitrix_inventory_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BITRIX_ENCRYPTION_KEY: ${BITRIX_ENCRYPTION_KEY}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      BITRIX_CONCURRENCY: ${BITRIX_CONCURRENCY}
      BITRIX_MAX_RETRIES: ${BITRIX_MAX_RETRIES}
      BITRIX_REQUEST_TIMEOUT: ${BITRIX_REQUEST_TIMEOUT}
      BATCH_SIZE: ${BATCH_SIZE}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      LICENTIC_PRODUCT_ID: ${LICENTIC_PRODUCT_ID}
      LICENTIC_API_BASE: ${LICENTIC_API_BASE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bitrix_network
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: bitrix_inventory_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - bitrix_network

volumes:
  postgres_data:
  redis_data:

networks:
  bitrix_network:
    driver: bridge
