server {
    listen 80;

    # Catch-all: this container is only ever reached through the shared reverse
    # proxy, so it never needs to know the public hostname.
    server_name _;

    # Must stay above MAX_FILE_SIZE_MB (10) to allow the multipart envelope for
    # Excel imports and stock-receipt uploads.
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Intercept 405 (Method Not Allowed) triggered when Bitrix24 opens the app via HTTP POST to static SPA routes
    error_page 405 =200 /index.html;

    # React Router SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://bitrix-inventory-backend:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;

        # Bitrix24 batch imports are long-running and poll for progress.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded Excel files served back through the backend
    location /uploads/ {
        proxy_pass http://bitrix-inventory-backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (Vite emits content-hashed filenames for cache busting)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Security headers (allow embedding inside Bitrix24 portal iframes and sliders; remove X-Frame-Options SAMEORIGIN)
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.bitrix24.in https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.net https://*.bitrix.info https://oauth.bitrix.info https://b24-zykr00.bitrix24.in;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
}

